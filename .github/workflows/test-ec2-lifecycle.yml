name: Test EC2 Start and Stop Lifecycle

on:
  workflow_dispatch:

jobs:
  start-ec2:
    name: Start EC2 Builder
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Start Instance and Wait
        run: |
          aws ec2 start-instances --instance-ids ${{ secrets.EC2_INSTANCE_ID }}
          aws ec2 wait instance-running --instance-ids ${{ secrets.EC2_INSTANCE_ID }}

  # NEW JOB ADDED HERE
  execute-on-ec2:
    name: Run Commands on EC2
    needs: start-ec2
    runs-on: [self-hosted, linux, X64]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Environment
        run: |
          echo "Currently running on: $(hostname)"
          echo "Listing repository files:"
          ls -la
          echo "Verifying Docker access:"
          docker info

  stop-ec2:
    name: Stop EC2 Builder
    needs: execute-on-ec2 # UPDATED TO WAIT FOR THE NEW JOB
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Stop Instance
        run: aws ec2 stop-instances --instance-ids ${{ secrets.EC2_INSTANCE_ID }}
